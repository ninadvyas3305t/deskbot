name: Build and Release DeskBot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            python-version: "3.11"
            artifact-name: DeskBotSetup-Windows-x64.exe
          - os: macos-14
            arch: arm64
            python-version: "3.11"
            artifact-name: DeskBot-macOS-arm64.dmg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r companion/requirements.txt
          pip install pyinstaller pytest

      - name: Run Test Suite
        run: |
          pytest companion/tests/

      # ----------------------------------------------------
      # Windows Build Pipeline
      # ----------------------------------------------------
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean -y build/deskbot.spec

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows Installer with Inno Setup
        if: runner.os == 'Windows'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/deskbot_setup.iss

      # ----------------------------------------------------
      # macOS Build Pipeline
      # ----------------------------------------------------
      - name: Build macOS Bundle and DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      # ----------------------------------------------------
      # Artifact Upload
      # ----------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.artifact-name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.exe
            dist-release/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
